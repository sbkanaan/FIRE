[workspace]
authors = ["Mitchell Robert Vollger <mrvollger@gmail.com>"]
channels = ["https://conda-forge.fredhutch.org/bioconda", "https://conda-forge.fredhutch.org/conda-forge"]
channel-priority = "disabled"
description = "Add a short description here"
name = "FIRE"
platforms = ["linux-64"]
version = "0.1.2"

[system-requirements]
linux = "4.15"
libc = { family = "glibc", version = "2.27" }

[tasks]
fmt = "ruff format . && taplo format pixi.toml && snakefmt workflow/"
test-data = { cmd = [
  "cd",
  "$INIT_CWD",
  "&&",
  "mkdir",
  "-p",
  "fire-test-data",
  "&&",
  "rclone",
  "sync",
  ":s3,env_auth=false,provider=Other,endpoint=s3.kopah.orci.washington.edu:stergachis/public/FIRE/test-data",
  "fire-test-data/",
] }
test = { cmd = [
  "cd",
  "$INIT_CWD/fire-test-data",
  "&&",
  "snakemake",
  "-s",
  "$PIXI_PROJECT_ROOT/workflow/Snakefile",
  "--configfile",
  "test.yaml",
  "-k",
], depends-on = [
  "test-data",
], clean-env = true }
fire = { cmd = [
  "cd",
  "$INIT_CWD",
  "&&",
  "snakemake",
  "-s",
  "$PIXI_PROJECT_ROOT/workflow/Snakefile",
], env = { PYTHONNOUSERSITE = "1" } }
slurm = { cmd = [
  "cd",
  "$INIT_CWD",
  "&&",
  "snakemake",
  "-s",
  "$PIXI_PROJECT_ROOT/workflow/Snakefile",
  "--profile",
  "$PIXI_PROJECT_ROOT/profiles/slurm-executor",
], env = { PYTHONNOUSERSITE = "1" } }

[dependencies]
conda = "*"
snakemake = "==8.21"
snakemake-executor-plugin-slurm = ">=0.11.2"
snakefmt = "*"
ruff = "*"
rclone = "*"
taplo = "*"

[pypi-dependencies]
